{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dear Deborah{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'friends:home' %}">
                <span class="brand-mark">DD</span>
                <span>
                    <strong>Dear Deborah</strong>
                    <small>A friendship archive</small>
                </span>
            </a>

            <nav class="top-nav" aria-label="Main navigation">
                <a class="nav-link" href="{% url 'friends:home' %}">Home</a>

                <div class="nav-dropdown">
                    <button type="button" class="nav-dropbtn">Friends</button>
                    <div class="nav-menu">
                        <a href="{% url 'friends:friend_directory' %}">Friend Directory</a>
                        <a href="{% url 'friends:add_friend' %}">Add Friend</a>
                        <a href="{% url 'friends:birthday_calendar' %}">Birthdays</a>
                    </div>
                </div>

                <div class="nav-dropdown">
                    <button type="button" class="nav-dropbtn">Memories</button>
                    <div class="nav-menu">
                        <a href="{% url 'friends:memories' %}">Memories</a>
                        <a href="{% url 'friends:memory_map' %}">Memory Map</a>
                    </div>
                </div>

                <div class="nav-dropdown">
                    <button type="button" class="nav-dropbtn">Dashboards</button>
                    <div class="nav-menu">
                        <a href="{% url 'friends:zodiac_dashboard' %}">Zodiac</a>
                        <a href="{% url 'friends:mbti_dashboard' %}">MBTI</a>
                        <a href="{% url 'friends:statistics' %}">Statistics</a>
                    </div>
                </div>

                <a class="nav-link" href="{% url 'friends:search' %}">Search</a>
                <a class="nav-link admin-link" href="/admin/">Admin</a>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
